[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
; Keep the serial monitor control lines inactive (our verified settings).
monitor_rts = 0
monitor_dtr = 0
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_D0:CF:13:43:69:D4-if00
monitor_port = ${env:esp32-s3-devkitc-1.upload_port}
test_port = ${env:esp32-s3-devkitc-1.upload_port}

; Enable native USB CDC serial through the connector labeled USB.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
